name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Polish is welcome too / można pisać po polsku. **Never paste** `secrets.yaml`, API keys or Wi-Fi passwords.
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Hood ESP (hbh.yaml) – control or the brain
        - Remote receiver (hbh-remote-rx.yaml)
        - Cards (hbh-cards.js)
        - Tools (learn_codes.py, …)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Steps to reproduce – what the hob, the hood and the card did, with times if you have them
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: HbH (CHANGELOG or the card's version in the browser console), ESPHome, Home Assistant
      placeholder: "HbH 0.1.0-beta, cards 0.7.0, ESPHome 2026.10.2, HA 2026.11.0"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Hood, profile and hob
      placeholder: "Ciarko Duo 74, ciarko_xy8011, AEG 3-phase hob on Shelly Pro 3EM"
  - type: textarea
    id: logs
    attributes:
      label: Device log
      description: "`esphome logs <device>.yaml` around the problem (lines with [hbh] help the most)"
      render: text
