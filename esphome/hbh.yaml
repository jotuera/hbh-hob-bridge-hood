select:
  - platform: template
    id: sel_speed
    name: "${n_fan_speed}"
    icon: mdi:fan
    options: ["0", "1", "2", "3", "${t_boost}"]
    set_action:
      - lambda: |-
          int i = x == "${t_boost}" ? 4 : atoi(x.c_str());
          hbh::manual_fan();
          hbh::request(hbh::J_SPEED, i);
  - platform: template
    id: sel_light
    name: "${n_light}"
    icon: mdi:lightbulb
    options: ["${t_off}", "25 %", "50 %", "75 %", "100 %"]
    set_action:
      - lambda: |-
          static const char *const LO[5] = {"${t_off}", "25 %", "50 %", "75 %", "100 %"};
          int i = 0;
          for (int k = 0; k < 5; k++) if (x == LO[k]) i = k;
          hbh::manual_light();
          hbh::request(hbh::J_LIGHT, i);
  - platform: template
    id: sel_colour
    name: "${n_colour}"
    icon: mdi:palette
    options: ["${t_cool}", "${t_warm}"]
    restore_value: true
    optimistic: false
    set_action:
