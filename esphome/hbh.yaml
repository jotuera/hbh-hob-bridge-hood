# HbH – Hob bridge Hood: transmitter + brain (M5Stack Atom Lite + Unit RF433T, Grove: DATA -> G26)
#
# Acts as a second remote of the hood and as the hood's brain (hbh.h):
#  - hood state (fan speed, light, brightness) computed from the hood's supply power,
#  - set speed / light / brightness / colour / timer, checked against the power,
#  - hob → hood: light when the hob is switched on, fan from the hob's power (profiles H0–H6), run-on,
#    manual takeover, colour by time of day, hob alarm, pairing after a power cut,
#  - drying (kitchen humid, outdoor air drier → fan 1) and a night reset of the hood relay.
# Everything that depends on the hood (RF frame, key codes, power table) comes from a profile in profiles/.
# Sources are Home Assistant entities chosen at runtime: device → Configuration → "Source: …",
# then press "Apply sources (restart)". In HA enable for this device:
# "Allow the device to perform Home Assistant actions" (hood relay on, notifications).
#
# Add to packages: a hood profile and a language file, e.g.
#   profile: !include profiles/ciarko_xy8011.yaml
#   lang: !include lang/hbh_en.yaml
substitutions:
  name: hbh-hood
  friendly_name: HbH Hood
  tx_pin: GPIO26
  # default sources (changeable at runtime in the device's configuration)
  src_hood_power: ""        # hood power, W (Shelly in the hood's supply) – required for the state
  src_hood_switch: ""       # hood relay (switch.*), optional – power on, pairing after a power cut
  src_hob_power: ""         # hob active power, W – one total entity, or phases summed: sensor.l1_power+sensor.l2_power
  src_hob_va: ""            # hob switched ON without heating, optional: apparent power (VA) or current (A), "+" sums phases;
                            # threshold "Hob ON threshold": about half of what the source shows after ON without heating
                            # (3-phase AEG: ≈ 380 VA after ON → 150; a 1-phase hob shows less – look at yours)
  src_aux1: ""              # extra source 1 (e.g. Thermomix power, W)
  src_aux2: ""              # extra source 2 (e.g. kettle power, W, or a "heating" state)
  src_remote: ""            # "Remote event" of hbh-remote-rx.yaml (sensor.*), optional
  # drying (optional) – "entity" or "entity:attribute", e.g. climate.kitchen:current_temperature
  src_room_rh: ""           # kitchen relative humidity, %
  src_room_t: ""            # kitchen temperature, °C
  src_out_t: ""             # outdoor temperature, °C
  src_out_rh: ""            # outdoor relative humidity, %
  auto_restore: RESTORE_DEFAULT_ON   # hob → hood automation on a fresh install

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - hbh.h
  on_boot:
    # after the config entities are restored, before Home Assistant connects
    priority: 190
    then:
      - lambda: |-
          hbh::set_profile(${pw_standby}, ${pw_fan1}, ${pw_fan2}, ${pw_fan3}, ${pw_boost_min},
                           ${pw_light1}, ${pw_light2}, ${pw_light3}, ${pw_light4},
                           ${rf_short_frames}, ${rf_hold_frames}, ${rf_colour_frames});
          hbh::S.today_wh = id(g_today_wh); hbh::S.day = id(g_day); hbh::S.filter_h = id(g_filter_h);
          // a calibrated power table overrides the profile
          if (id(g_cal_valid)) {
            auto &c = id(g_cal);
            hbh::set_profile(c[0], c[1], c[2], c[3], c[4], c[5], c[6], c[7], c[8],
                             ${rf_short_frames}, ${rf_hold_frames}, ${rf_colour_frames});
          }
          hbh::cal_store = [](const float *t, bool valid) {
            for (int i = 0; i < 9; i++) id(g_cal)[i] = t[i];
            id(g_cal_valid) = valid;
          };
          // keys of the profile ("" = the remote has no such key); codes learned by the wizard override them
          hbh::PROFILE_KEYS = {
            {"light", "${key_light}"}, {"fan_minus", "${key_fan_minus}"}, {"fan_plus", "${key_fan_plus}"},
            {"timer", "${key_timer}"}, {"brighter", "${key_brighter}"}, {"dimmer", "${key_dimmer}"},
            {"light_on", "${key_light_on}"}, {"light_off", "${key_light_off}"}, {"fan_off", "${key_fan_off}"},
            {"power", "${key_power}"},
          };
          {
            std::string l = "${rf_learn_keys}", w;
            for (char c : l + ",") { if (c == ',') { if (!w.empty()) hbh::LEARN_KEYS.push_back(w); w.clear(); } else if (c != ' ') w += c; }
          }
          hbh::FRAME_BITS = ${rf_frame_bits};
          hbh::TOGGLE_BIT = ${rf_toggle_bit};
          hbh::has_receiver = id(src_remote).state.find('.') != std::string::npos;
          // stored per key: (length << 58) | bits, 0 = not learned
          if (id(g_keys_valid)) {
            for (int i = 0; i < 10; i++) {
              uint64_t v = id(g_keys)[i];
              int n = (int) (v >> 58);
              if (n <= 0) continue;
              std::string b;
              for (int j = n - 1; j >= 0; j--) b += ((v >> j) & 1) ? '1' : '0';
              hbh::KEYS[hbh::ALL_KEYS[i]] = b;
            }
            hbh::keys_learned = !hbh::KEYS.empty();
          }
          hbh::remote_pub = [](const std::string &v) { id(st_rkey).publish_state(v); };
          hbh::keys_store = []() {
            for (int i = 0; i < 10; i++) {
              uint64_t v = 0;
              auto it = hbh::KEYS.find(hbh::ALL_KEYS[i]);
              if (it != hbh::KEYS.end() && it->second.size() <= 58) {
                for (char c : it->second) v = (v << 1) | (c == '1' ? 1 : 0);
                v |= (uint64_t) it->second.size() << 58;
              }
              id(g_keys)[i] = v;
            }
            id(g_keys_valid) = true;
          };
          hbh::tx_send = [](const std::string &k, int n) { id(send_rf)->execute(k, n); };
          hbh::tx_busy = []() { return id(send_rf)->is_running(); };
          hbh::hood_power_on = []() { id(hood_power_on).execute(); };
          hbh::hood_power_off = []() { id(hood_power_off).execute(); };
          hbh::notify = [](const std::string &kind, float w, float m) { id(hob_alarm).execute(kind, w, m); };
          if (id(sel_colour).has_state()) hbh::colour = id(sel_colour).current_option() == std::string("${t_cool}") ? "cool" : "warm";
          hbh::subscribe(id(src_hood_p).state, [](const std::string &v) { hbh::on_hood_power(hbh::to_float(v)); });
          hbh::subscribe(id(src_hood_sw).state, [](const std::string &v) { hbh::IN.hood_sw = v; });
          // hob on 1, 2 or 3 phases: one total entity, or the phases summed with "+"
          hbh::subscribe_sum(id(src_hob_p).state, [](float v) { hbh::on_hob_power(v); });
          hbh::IN.has_hob_va = id(src_hob_va).state.find('.') != std::string::npos;
          hbh::subscribe_sum(id(src_hob_va).state, [](float v) { hbh::IN.hob_va = v; });
          hbh::subscribe(id(src_aux1).state, [](const std::string &v) { hbh::IN.aux1 = v; });
          hbh::subscribe(id(src_aux2).state, [](const std::string &v) { hbh::IN.aux2 = v; });
          hbh::subscribe(id(src_remote).state, [](const std::string &v) { hbh::on_remote(v); });
          hbh::subscribe(id(src_room_rh).state, [](const std::string &v) { hbh::IN.room_rh = hbh::to_float(v); });
          hbh::subscribe(id(src_room_t).state, [](const std::string &v) { hbh::IN.room_t = hbh::to_float(v); });
          hbh::subscribe(id(src_out_t).state, [](const std::string &v) { hbh::IN.out_t = hbh::to_float(v); });
          hbh::subscribe(id(src_out_rh).state, [](const std::string &v) { hbh::IN.out_rh = hbh::to_float(v); });

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret hbh_api_key
  actions:
    # any remote key: key = light / fan_minus / fan_plus / timer / brighter / dimmer, frames = how long (profile:
    # rf_short_frames = a short press, rf_hold_frames = stop / boost hold, rf_colour_frames = colour hold)
    - action: send
      variables:
        key: string
        frames: int
      then:
        - script.execute: {id: send_rf, key: !lambda "return key;", frames: !lambda "return frames;"}

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # optional static IP (recommended when HA is in another VLAN – mDNS does not cross VLANs)
  # manual_ip:
  #   static_ip: 192.168.1.78
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

globals:
  # statistics kept across restarts (written to flash at most once a minute)
  - id: g_today_wh
    type: float
    restore_value: true
    initial_value: '0'
  - id: g_day
    type: int
    restore_value: true
    initial_value: '-1'
  - id: g_filter_h
    type: float
    restore_value: true
    initial_value: '0'
  # power table measured by the calibration (net W): standby, fan 1–3, boost threshold, light 25–100 % – overrides the profile
  - id: g_cal
    type: std::array<float, 9>
    restore_value: true
  - id: g_cal_valid
    type: bool
    restore_value: true
    initial_value: 'false'
  # codes of the user's remote learned by the wizard (frame bits, MSB first, toggle bit 0) – override the profile
  - id: g_keys
    type: std::array<uint64_t, 10>
    restore_value: true
  - id: g_keys_valid
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: burst_ms         # duration of the burst being sent
    type: uint32_t
    initial_value: '0'
  - id: tgl              # toggle bit – flips on every press, like the remote
    type: bool
    initial_value: 'false'

script:
  - id: send_rf
    mode: queued
    max_runs: 10
    parameters:
      key: string
      frames: int
    then:
      - light.turn_on: {id: led, brightness: 30%, red: 0%, green: 60%, blue: 100%}
      - lambda: |-
          // code: learned by the wizard, else the profile's ("" = the remote has no such key)
          std::string code = hbh::key_code(key);
          if (code.empty()) { ESP_LOGW("rf", "the remote has no key %s", key.c_str()); return; }
          id(tgl) = !id(tgl);
          const int tb = ${rf_toggle_bit};
          if (tb >= 0 && tb < (int) code.size()) code[tb] = id(tgl) ? '1' : '0';
          int n = frames < 1 ? 1 : (frames > 300 ? 300 : frames);
          // frame of the profile: [start pulse] + bits + [sync]; a bit is mark-space ("hl", PT2262 / Ciarko) or
          // space-mark ("lh", CAME); the whole burst in one buffer, frames back to back (like the remote)
          const int START = ${rf_start_high}, SH = ${rf_sync_high}, SL = ${rf_sync_low};
          const bool LH = std::string("${rf_bit_order}") == "lh";
          auto call = id(rf_tx).transmit();
          auto *d = call.get_data();
          d->set_carrier_frequency(0);
          for (int r = 0; r < n; r++) {
            if (START > 0) d->mark(START);
            for (char b : code) {
              int h = b == '1' ? ${rf_one_high} : ${rf_zero_high}, l = b == '1' ? ${rf_one_low} : ${rf_zero_low};
              if (LH) { d->space(l); d->mark(h); } else { d->mark(h); d->space(l); }
            }
            if (SH > 0) d->mark(SH);
            d->space(SL);
          }
          call.perform();
          // the burst runs in the background; the script waits for it
          uint32_t frame_us = START + SH + SL;
          for (char b : code) frame_us += b == '1' ? ${rf_one_high} + ${rf_one_low} : ${rf_zero_high} + ${rf_zero_low};
          id(burst_ms) = (uint32_t) ((uint64_t) n * frame_us / 1000) + 20;
          hbh::last_tx = millis() + id(burst_ms);
          ESP_LOGI("rf", "%s x%d toggle=%d", key.c_str(), n, (int) id(tgl));
          // hint for the state estimator
          const bool held = n > 3 * ${rf_short_frames};
          if (key == "fan_plus") hbh::on_cmd(held ? "boost" : "fan_plus");
          else if (key == "fan_minus") hbh::on_cmd(held ? "stop" : "fan_minus");
          else if (key == "light") hbh::on_cmd(hbh::E.pl ? "light_off" : "light_on");
          else if (key == "fan_off") hbh::on_cmd("stop");
          else if (key == "light_on" || key == "light_off") hbh::on_cmd(key);
          else if ((key == "brighter" || key == "dimmer") && !held) hbh::on_cmd("brightness");
      - delay: !lambda "return id(burst_ms);"
      - light.turn_off: led
      # silence after every press – with no gap the hood merges two presses into one (tested 04.11)
      - delay: 400ms

  # hood relay on (any domain: switch / light / input_boolean)
  - id: hood_power_on
    then:
      - if:
          condition:
            lambda: 'return id(src_hood_sw).state.find(".") != std::string::npos;'
          then:
            - homeassistant.action:
                action: homeassistant.turn_on
                data:
                  entity_id: !lambda 'return id(src_hood_sw).state;'

  - id: hood_power_off
    then:
      - if:
          condition:
            lambda: 'return id(src_hood_sw).state.find(".") != std::string::npos;'
          then:
            - homeassistant.action:
                action: homeassistant.turn_off
                data:
                  entity_id: !lambda 'return id(src_hood_sw).state;'

  # hob alarm: HA event esphome.hbh_alarm {kind, message, power_w, minutes} + persistent notification
  # kind = nobody_home / too_long / end – use the event for your own phone notifications
  - id: hob_alarm
    parameters:
      kind: string
      watts: float
      minutes: float
    then:
      - homeassistant.event:
          event: esphome.hbh_alarm
          data:
            kind: !lambda 'return kind;'
            message: !lambda |-
              if (kind == "end") return std::string("");
              char b[48]; snprintf(b, sizeof(b), " – %.0f W, %.0f min", watts, minutes);
              return std::string(kind == "nobody_home" ? "${t_alarm_nobody}" : "${t_alarm_long}") + b;
            power_w: !lambda 'return (int) watts;'
            minutes: !lambda 'return (int) minutes;'
      - if:
          condition:
            lambda: 'return kind != "end";'
          then:
            - homeassistant.action:
                action: persistent_notification.create
                data:
                  notification_id: hbh_hob_alarm
                  title: "${t_alarm_title}"
                  message: !lambda |-
                    char b[48]; snprintf(b, sizeof(b), " – %.0f W, %.0f min", watts, minutes);
                    return std::string(kind == "nobody_home" ? "${t_alarm_nobody}" : "${t_alarm_long}") + b;
          else:
            - homeassistant.action:
                action: persistent_notification.dismiss
                data:
                  notification_id: hbh_hob_alarm

remote_transmitter:
  id: rf_tx
  pin: ${tx_pin}
  carrier_duty_percent: 100%
  non_blocking: true     # a 6 s colour hold would block the main loop past the task watchdog (5 s) – the script waits instead

# Atom Lite RGB LED – short blue flash while transmitting
light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "LED"
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    channel_colors: GRB
    internal: true

interval:
  - interval: 200ms
    then:
      - lambda: |-
          // settings -> brain
          hbh::C.auto_on = id(sw_auto).state;
          hbh::C.auto_light = id(sw_auto_light).state;
          hbh::C.auto_colour = id(sw_auto_colour).state;
          hbh::C.alarm_on = id(sw_alarm).state;
          hbh::C.aux1_on = id(sw_aux1).state;
          hbh::C.aux2_on = id(sw_aux2).state;
          hbh::C.profile = id(sel_profile).active_index().value_or(5);
          hbh::C.runon_min = id(n_runon).state;
          hbh::C.runon_aux_min = id(n_runon_aux).state;
          hbh::C.light_after_min = id(n_light_after).state;
          hbh::C.p2 = id(n_p2).state;
          hbh::C.p3 = id(n_p3).state;
          hbh::C.alarm_min = id(n_alarm).state;
          hbh::C.hob_on_thr = id(n_hob_on_thr).state;
          hbh::C.aux1_thr = id(n_aux1_thr).state;
          hbh::C.aux2_thr = id(n_aux2_thr).state;
          hbh::C.cold_from = id(dt_cold).hour * 60 + id(dt_cold).minute;
          hbh::C.dry_on = id(sw_dry).state;
          hbh::C.dry_start = id(n_dry_start).state;
          hbh::C.dry_stop = id(n_dry_stop).state;
          hbh::C.dry_diff = id(n_dry_diff).state;
          hbh::C.dry_max_min = id(n_dry_max).state;
          hbh::C.dry_tmin = id(n_dry_tmin).state;
          hbh::C.dry_from = id(dt_dry_from).hour * 60 + id(dt_dry_from).minute;
          hbh::C.dry_to = id(dt_dry_to).hour * 60 + id(dt_dry_to).minute;
          hbh::C.night_on = id(sw_night).state;
          hbh::C.night_at = id(dt_night).hour * 60 + id(dt_night).minute;
          hbh::C.warm_from = id(dt_warm).hour * 60 + id(dt_warm).minute;
          auto tm = id(ha_time).now();
          hbh::C.now_min = tm.is_valid() ? tm.hour * 60 + tm.minute : -1;
          hbh::IN.home = id(ha_home).state;
          hbh::loop();
          hbh::loop_stats(tm.is_valid() ? tm.day_of_year : -1);
          // statistics -> entities (and to the restored globals once a minute)
          static uint32_t last_save = 0;
          if (millis() - last_save > 60000) {
            last_save = millis();
            id(g_today_wh) = hbh::S.today_wh; id(g_day) = hbh::S.day; id(g_filter_h) = hbh::S.filter_h;
            id(st_energy_today).publish_state(hbh::S.today_wh / 1000.0);
            float use = id(n_filter_hours).state > 0 ? hbh::S.filter_h / id(n_filter_hours).state * 100.0f : 0;
            id(st_filter_usage).publish_state(use);
            id(st_filter_due).publish_state(use >= 100);
          }
          // calibration state and the power table in use
          static std::string cal_last, tab_last;
          std::string cs;
          if (hbh::CAL.active) cs = std::string("${t_cal_running} ") + std::to_string(hbh::CAL.step + 1) + "/10";
          else if (hbh::CAL.result == "ok") cs = "${t_cal_ok}";
          else if (hbh::CAL.result.rfind("close:", 0) == 0) cs = std::string("${t_cal_close}") + " (" + hbh::CAL.result.substr(6) + ")";
          else if (hbh::CAL.result == "failed") cs = "${t_cal_failed}";
          else if (hbh::CAL.result == "aborted") cs = "${t_cal_aborted}";
          else cs = id(g_cal_valid) ? "${t_cal_ok}" : "${t_cal_profile}";
          if (cs != cal_last) { cal_last = cs; id(st_cal).publish_state(cs); }
          // learning the remote: "Learning n/12" (2 presses of 6 keys) or the codes in use
          static std::string lrn_last;
          std::string ls;
          // "Learning 3/12 · fan_minus": progress and the key to press (the cards show its name)
          if (hbh::LRN.active) ls = std::string("${t_lrn_running} ") + std::to_string(hbh::LRN.step + 1) + "/" + std::to_string(hbh::learn_steps()) + " · " + hbh::learn_key();
          else if (hbh::LRN.result == "aborted") ls = "${t_lrn_aborted}";
          else if (hbh::LRN.result == "no_rx") ls = "${t_lrn_norx}";
          else ls = hbh::keys_learned ? "${t_lrn_ok}" : "${t_lrn_profile}";
          if (ls != lrn_last) { lrn_last = ls; id(st_lrn).publish_state(ls); }
          char tb[96];
          snprintf(tb, sizeof(tb), "%.1f | %.1f / %.1f / %.1f / %.0f+ | %.1f / %.1f / %.1f / %.1f", hbh::PW_STANDBY, hbh::W_FAN[1],
                   hbh::W_FAN[2], hbh::W_FAN[3], hbh::PW_BOOST, hbh::LV[0], hbh::LV[1], hbh::LV[2], hbh::LV[3]);
          if (tab_last != tb) { tab_last = tb; id(st_table).publish_state(tb); }
          static float lk = -1;
          if (!std::isnan(hbh::S.last_kwh) && hbh::S.last_kwh != lk) {
            lk = hbh::S.last_kwh;
            id(st_last_energy).publish_state(hbh::S.last_kwh);
            id(st_last_time).publish_state(hbh::S.last_min);
          }
          // brain -> entities (only changes)
          static int pb = -1, pl = -1, lvl = -1, ts = -9, tl = -9, rec = -1, tleft = -1;
          static int got = -1, hob = -1, alarm = -1, prob = -1, busy = -1, a1 = -1, a2 = -1, dry = -1, drs = -1;
          static float rah = -100, oah = -100, rrh = -100, rt = -100, ot = -100, orh = -100;
          auto pubf = [](float v, float &last, esphome::sensor::Sensor *s, float step) {
            if (std::isnan(v) ? !std::isnan(last) : (std::isnan(last) || std::fabs(v - last) >= step)) { last = v; s->publish_state(v); }
          };
          pubf(hbh::B.room_ah, rah, id(st_room_ah), 0.05f);
          pubf(hbh::B.out_ah, oah, id(st_out_ah), 0.05f);
          pubf(hbh::IN.room_rh, rrh, id(st_room_rh), 0.5f);
          pubf(hbh::IN.room_t, rt, id(st_room_t), 0.1f);
          pubf(hbh::IN.out_t, ot, id(st_out_t), 0.1f);
          pubf(hbh::IN.out_rh, orh, id(st_out_rh), 0.5f);
          if ((int) hbh::B.aux1.state != a1) { a1 = hbh::B.aux1.state; id(st_aux1).publish_state(a1); }
          if ((int) hbh::B.aux2.state != a2) { a2 = hbh::B.aux2.state; id(st_aux2).publish_state(a2); }
          if ((int) hbh::B.drying != dry) { dry = hbh::B.drying; id(st_drying).publish_state(dry); }
          if (hbh::B.dry_state != drs) {
            drs = hbh::B.dry_state;
            static const char *const DS[3] = {"${t_dry_off}", "${t_dry_wait}", "${t_dry_run}"};
            id(st_dry_state).publish_state(DS[drs]);
          }
          static float avg = -100;   // first value always published
          static std::string code, bar;
          static int mode = -1;
          if (hbh::E.pb != pb) {
            pb = hbh::E.pb; id(st_speed).publish_state(pb);
            id(sel_speed).publish_state(pb == 4 ? std::string("${t_boost}") : std::to_string(pb));
          }
          int l = hbh::light_level();
          if ((hbh::E.pl ? 1 : 0) != pl || l != lvl) {
            pl = hbh::E.pl ? 1 : 0; lvl = l;
            id(st_light).publish_state(pl == 1);
            id(st_brightness).publish_state(l * 25);
            static const char *const LO[5] = {"${t_off}", "25 %", "50 %", "75 %", "100 %"};
            id(sel_light).publish_state(LO[l]);
          }
          if (hbh::target_speed != ts) { ts = hbh::target_speed; id(st_target_speed).publish_state(ts < 0 ? NAN : ts); }
          int tlv = hbh::target_light == 9 ? (lvl > 0 ? lvl : 4) : hbh::target_light;
          if (tlv != tl) { tl = tlv; id(st_target_brightness).publish_state(tl < 0 ? NAN : tl * 25); }
          if (hbh::B.rec != rec) { rec = hbh::B.rec; id(st_rec).publish_state(rec); }
          int left = hbh::timer_end ? std::max(0, (int) ((int32_t) (hbh::timer_end - millis()) / 1000)) : 0;
          if (left != tleft) { tleft = left; id(st_timer).publish_state(left); }
          if ((int) hbh::B.cooking != got) { got = hbh::B.cooking; id(st_cooking).publish_state(got); }
          if ((int) hbh::B.hob_on.state != hob) { hob = hbh::B.hob_on.state; id(st_hob).publish_state(hob); }
          if ((int) hbh::B.alarm != alarm) { alarm = hbh::B.alarm; id(st_alarm).publish_state(alarm); }
          if ((int) hbh::rf_problem != prob) { prob = hbh::rf_problem; id(st_rf_problem).publish_state(prob); }
          if ((int) hbh::job_active != busy) { busy = hbh::job_active; id(st_busy).publish_state(busy); }
          if (std::fabs(hbh::B.avg2 - avg) >= 5) { avg = hbh::B.avg2; id(st_avg).publish_state(avg); }
          char buf[24]; snprintf(buf, sizeof(buf), "%d|%d|%.1f", hbh::E.pb, hbh::E.pl ? 1 : 0, hbh::E.L);
          if (code != buf) { code = buf; id(st_code).publish_state(buf); }
          if (mode != hbh::B.mode) {
            mode = hbh::B.mode;
            static const char *const MODES[5] = {"${t_mode_off}", "${t_mode_standby}", "${t_mode_auto}", "${t_mode_manual}", "${t_mode_runon}"};
            id(st_mode).publish_state(MODES[mode]);
          }
          std::string b = hbh::colour == "cool" ? "${t_cool}" : "${t_warm}";
          if (!hbh::colour.empty() && bar != b) { bar = b; id(sel_colour).publish_state(b); }

