# HbH – hood profile: Novy cooker hoods with the white RF remote 840029 (4 keys: light, power, fan + / −)
# The remote has 10 pairing codes (1 = factory default); the codes below are pairing code 1. Fan + / − send
# shorter 12-bit frames, light and power 18-bit frames. Home Assistant 2026.5+ also has its own Novy Cooker Hood
# integration – HbH adds the hob automation and the hood state from the power reading.
#
# All 10 pairing codes – frame = 4 bits code + 0101 + key (libussa/esphome-novy, confirmed for code 1 by the captures):
#   code light (18 bit)           power (18 bit)           fan + (12)     fan − (12)
#    1   01010101 0111010001   01010101 0111010011   01010101 0101   01010101 0110
#    2   10010101 0111010001   10010101 0111010011   10010101 0101   10010101 0110
#    3   00010101 0111010001   00010101 0111010011   00010101 0101   00010101 0110
#    4   11100101 0111010001   11100101 0111010011   11100101 0101   11100101 0110
#    5   01100101 0111010001   01100101 0111010011   01100101 0101   01100101 0110
#    6   10100101 0111010001   10100101 0111010011   10100101 0101   10100101 0110
#    7   00100101 0111010001   00100101 0111010011   00100101 0101   00100101 0110
#    8   11000101 0111010001   11000101 0111010011   11000101 0101   11000101 0110
#    9   01000101 0111010001   01000101 0111010011   01000101 0101   01000101 0110
#   10   10000101 0111010001   10000101 0111010011   10000101 0101   10000101 0110
# The remote also has a "novy" key (…0100, 12 bit) – no function known. The Novy 840039 remote (Cloud 230) uses
# the same frames plus keys for the cooking / ambient light (SIGNALduino, RFD-FHEM/RFFHEM 14_SD_UT.pm).#
# Frame: CAME, OOK at 433.92 MHz – a start pulse, then every bit as (space, mark): 1 = long space + short mark,
# 0 = short space + long mark (the convention of Flipper Zero's CAME protocol, so Flipper "Key" values can be used
# as they are), then a long gap. No toggle bit. The first bits are the address of the remote (paired with the
# hood), the last 6 bits the command.
#
# STATUS: codes and timing from published captures – NOT tested on a hood by the author. The codes below are
# from someone else's remote: learn yours with the wizard ("Learn remote") – the command bits stay the same,
# the address changes. Please report in an issue whether it works.
#
# Sources: Flipper Zero captures in UberGuidoZ/Flipper (Sub-GHz/Misc/Novy_Pure_Line_682X_Kitchen_Hood),
# VanIseghemThomas/novy-esphome (timing 350 µs) and the Home Assistant community thread "ESPHome control Novy hood
# with FS1000A RF transmitter".
substitutions:
  profile_name: "Novy 840029 (untested)"

  # ---- RF frame (µs)
  rf_one_high: "350"        # bit 1: short mark …
  rf_one_low: "700"         # … after a long space
  rf_zero_high: "700"
  rf_zero_low: "350"
  rf_start_high: "350"      # start pulse
  rf_bit_order: "lh"         # a bit = space, mark
  rf_sync_high: "0"
  rf_sync_low: "12600"       # gap after a frame
  rf_frame_bits: "18"
  rf_toggle_bit: "-1"        # none
  rf_short_frames: "15"
  rf_hold_frames: "90"
  rf_colour_frames: "90"
  # ---- keys: full frames ("" = the remote has no such key)
  key_light: "010101010111010001"            # 0x155D1 light toggle (hold = dim)
  key_power: "010101010111010011"            # 0x155D3 hood on / off
  key_fan_plus: "010101010101"               # 0x555 (12 bit) fan +
  key_fan_minus: "010101010110"              # 0x556 (12 bit) fan −
  key_timer: ""
  key_brighter: ""
  key_dimmer: ""
  key_light_on: ""
  key_light_off: ""
  key_fan_off: ""
  key_speed_1: ""
  key_speed_2: ""
  key_speed_3: ""
  key_speed_4: ""
  # keys the learning wizard asks for, in this order
  rf_learn_keys: "light,power,fan_plus,fan_minus"

  # ---- power table, net W above standby: NOT MEASURED for this hood – placeholders. Press "Calibrate hood" (needs a
  # remote with fan + up to boost and brighter / dimmer) or measure the hood with its Shelly and put the values here.
  pw_standby: "0.5"
  pw_fan1: "5"
  pw_fan2: "12"
  pw_fan3: "30"
  pw_boost_min: "100"
  pw_light1: "4"
  pw_light2: "8"
  pw_light3: "12"
  pw_light4: "16"
