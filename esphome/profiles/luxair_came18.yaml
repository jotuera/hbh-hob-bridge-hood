# HbH – hood profile: Luxair (UK) cooker hoods with the 433 MHz RF remote (5 keys: fan + / − / off, light, timer)#
# Frame: CAME, OOK at 433.92 MHz – a start pulse, then every bit as (space, mark): 1 = long space + short mark,
# 0 = short space + long mark (the convention of Flipper Zero's CAME protocol, so Flipper "Key" values can be used
# as they are), then a long gap. No toggle bit. The first bits are the address of the remote (paired with the
# hood), the last 6 bits the command.
#
# STATUS: codes and timing from published captures – NOT tested on a hood by the author. The codes below are
# from someone else's remote: learn yours with the wizard ("Learn remote") – the command bits stay the same,
# the address changes. Please report in an issue whether it works.
#
# Source: josephdouce/esp-home-hob2hood-luxair (raw timings 394 / 788 µs, converted to the Flipper convention).
substitutions:
  profile_name: "Luxair CAME 18-bit (untested)"

  # ---- RF frame (µs)
  rf_one_high: "394"        # bit 1: short mark …
  rf_one_low: "788"         # … after a long space
  rf_zero_high: "788"
  rf_zero_low: "394"
  rf_start_high: "394"      # start pulse
  rf_bit_order: "lh"         # a bit = space, mark
  rf_sync_high: "0"
  rf_sync_low: "10000"       # gap after a frame
  rf_frame_bits: "18"
  rf_toggle_bit: "-1"        # none
  rf_short_frames: "6"
  rf_hold_frames: "60"
  rf_colour_frames: "60"
  # ---- keys: full frames ("" = the remote has no such key)
  key_fan_plus: "110110011111010100"         # 0x367D4 fan +
  key_fan_minus: "110110011111010010"        # 0x367D2 fan −
  key_fan_off: "110110011111010101"          # 0x367D5 fan off
  key_timer: "110110011111010001"            # 0x367D1 timer (10 min)
  key_light: "110110011111010110"            # 0x367D6 light toggle (hold = dim)
  key_brighter: ""
  key_dimmer: ""
  key_light_on: ""
  key_light_off: ""
  key_power: ""
  key_speed_1: ""
  key_speed_2: ""
  key_speed_3: ""
  key_speed_4: ""
  # keys the learning wizard asks for, in this order
  rf_learn_keys: "fan_plus,fan_minus,fan_off,timer,light"

  # ---- power table, net W above standby: NOT MEASURED for this hood – placeholders. Press "Calibrate hood" (any key
  # layout of the profiles) or measure the hood with its Shelly and put the values here.
  pw_standby: "0.5"
  pw_fan1: "5"
  pw_fan2: "12"
  pw_fan3: "30"
  pw_boost_min: "100"
  pw_light1: "4"
  pw_light2: "8"
  pw_light3: "12"
  pw_light4: "16"
