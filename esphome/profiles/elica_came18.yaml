# HbH – hood profile: Elica cooker hoods with the 433 MHz RF remote (6 keys: light on / off / toggle, fan − / + / off)
# Elica builds hoods for other brands too – the same remote may come with other names on the hood.#
# Frame: CAME, OOK at 433.92 MHz – a start pulse, then every bit as (space, mark): 1 = long space + short mark,
# 0 = short space + long mark (the convention of Flipper Zero's CAME protocol, so Flipper "Key" values can be used
# as they are), then a long gap. No toggle bit. The first bits are the address of the remote (paired with the
# hood), the last 6 bits the command.
#
# STATUS: codes and timing from published captures – NOT tested on a hood by the author. The codes below are
# from someone else's remote: learn yours with the wizard ("Learn remote") – the command bits stay the same,
# the address changes. Please report in an issue whether it works.
#
# Sources: Flipper Zero captures in UberGuidoZ/Flipper (Sub-GHz/Cooker_Hoods/Elica) and
# Crystal-Matter/elica-rangehood-matter (MIT) – two remotes, addresses 0xB25 and 0x7FA, the same command bits.
substitutions:
  profile_name: "Elica CAME 18-bit (untested)"

  # ---- RF frame (µs)
  rf_one_high: "320"        # bit 1: short mark …
  rf_one_low: "640"         # … after a long space
  rf_zero_high: "640"
  rf_zero_low: "320"
  rf_start_high: "320"      # start pulse
  rf_bit_order: "lh"         # a bit = space, mark
  rf_sync_high: "0"
  rf_sync_low: "15000"       # gap after a frame
  rf_frame_bits: "18"
  rf_toggle_bit: "-1"        # none
  rf_short_frames: "8"
  rf_hold_frames: "60"
  rf_colour_frames: "60"
  # ---- keys: full frames ("" = the remote has no such key)
  key_light: "101100100101110101"            # 0x2C975 light toggle   (command 0x35)
  key_light_on: "101100100101110111"         # 0x2C977 light on       (0x37)
  key_light_off: "101100100101110000"        # 0x2C970 light off      (0x30)
  key_fan_plus: "101100100101010111"         # 0x2C957 fan +          (0x17)
  key_fan_minus: "101100100101010000"        # 0x2C950 fan −          (0x10)
  key_fan_off: "101100100101010101"          # 0x2C955 fan off        (0x15)
  # the other remote: light 0x1FEB5, fan + 0x1FE97, fan − 0x1FE90, fan off 0x1FE95
  key_timer: ""
  key_brighter: ""
  key_dimmer: ""
  key_power: ""
  key_speed_1: ""
  key_speed_2: ""
  key_speed_3: ""
  key_speed_4: ""
  # keys the learning wizard asks for, in this order
  rf_learn_keys: "light,light_on,light_off,fan_plus,fan_minus,fan_off"

  # ---- power table, net W above standby: NOT MEASURED for this hood – placeholders. Press "Calibrate hood" (needs a
  # remote with fan + up to boost and brighter / dimmer) or measure the hood with its Shelly and put the values here.
  pw_standby: "0.5"
  pw_fan1: "5"
  pw_fan2: "12"
  pw_fan3: "30"
  pw_boost_min: "100"
  pw_light1: "4"
  pw_light2: "8"
  pw_light3: "12"
  pw_light4: "16"
