# HbH – hood profile: Zephyr hoods with the round 4-key remote (Lux Glo Island DLG-E36AWX; OEM Leyant)
#
# !!! 315 MHz – the Unit RF433T / RF433R work at 433.92 MHz only. Use 315 MHz modules (or a CC1101 tuned to 315). !!!
#
# Frame: PT2262 / EV1527, OOK – 24 bits as (mark, space), T = 270 µs: 0 = 1T + 3T, 1 = 3T + 1T, then a sync
# 1T + 31T. 16-bit address + 8-bit command, no toggle bit. The light and fan keys step through the levels inside
# the hood (off → low → medium → high → off), so a level cannot be set directly.
#
# STATUS: from a published capture – NOT tested on a hood by the author. The address 0x0514 is someone else's
# remote: learn yours with the wizard ("Learn remote").
#
# Source: james-malone/zephyr-hood-rf-esphome (Apache-2.0), docs/PROTOCOL.md.
substitutions:
  profile_name: "Zephyr PT2262 315 MHz (untested)"

  # ---- RF frame (µs)
  rf_one_high: "810"
  rf_one_low: "270"
  rf_zero_high: "270"
  rf_zero_low: "810"
  rf_start_high: "0"
  rf_bit_order: "hl"         # a bit = mark, space
  rf_sync_high: "270"
  rf_sync_low: "8370"
  rf_frame_bits: "24"
  rf_toggle_bit: "-1"
  rf_short_frames: "10"
  rf_hold_frames: "10"       # the remote has no hold functions
  rf_colour_frames: "10"
  # ---- keys: full frames ("" = the remote has no such key)
  key_light: "000001010001010000110000"      # 0x051430 light (steps the level)
  key_fan_plus: "000001010001010000000011"   # 0x051403 fan (steps the speed)
  key_power: "000001010001010000001100"      # 0x05140C fan and light off
  key_timer: "000001010001010011000000"      # 0x0514C0 delay off
  key_fan_minus: ""
  key_brighter: ""
  key_dimmer: ""
  key_light_on: ""
  key_light_off: ""
  key_fan_off: ""
  key_speed_1: ""
  key_speed_2: ""
  key_speed_3: ""
  key_speed_4: ""
  # keys the learning wizard asks for, in this order
  rf_learn_keys: "light,fan_plus,power,timer"

  # ---- power table, net W above standby: NOT MEASURED for this hood – placeholders. Press "Calibrate hood" (any key
  # layout of the profiles) or measure the hood with its Shelly and put the values here.
  pw_standby: "0.5"
  pw_fan1: "5"
  pw_fan2: "12"
  pw_fan3: "30"
  pw_boost_min: "100"
  pw_light1: "4"
  pw_light2: "8"
  pw_light3: "12"
  pw_light4: "16"
