# HbH – Hob bridge Hood: receiver for the ORIGINAL remote (M5Stack Atom Lite + Unit RF433R)
#
# !!! The RF433R outputs its data on G32 (the other Grove wire), not on G26 like the RF433T. !!!
#
# Decodes the remote's frames with the hood profile (RF frame + key codes) and, when a key is released, sends the
# Home Assistant event esphome.hbh_remote {key, frames, held_ms}; frames = number of frames, held_ms = how long the
# key was held. key = light / fan_minus / fan_plus / timer / brighter / dimmer. The toggle bit is ignored for
# recognition; a change of the toggle bit = a new press.
#
# The same press is also published as the text sensor "Remote event" = "seq|key|frames|held_ms|bits" – set it as
# "Source: remote receiver" of hbh.yaml, so the brain knows when someone used the remote (it ignores the echo of
# its own transmitter). bits = the frame with the toggle bit 0.
#
# A frame that matches no key of the profile is a press with key "unknown" (and its bits): the learning wizard of
# hbh.yaml learns the user's remote from it, and the hood ESP recognises the keys by the learned codes – the
# receiver itself needs no codes of the user's remote. Unknown frames are also counted and logged
# (INFO "unknown frame: <bits>") for tools/learn_codes.py.
#
# In HA: Settings → Devices & services → ESPHome → this device → Configure →
# enable "Allow the device to perform Home Assistant actions", otherwise no events arrive.
#
# Add to packages: the same hood profile as hbh.yaml and a language file, e.g.
#   profile: !include profiles/ciarko_xy8011.yaml
#   lang: !include lang/remote_rx_en.yaml
substitutions:
  name: hbh-remote-rx
  friendly_name: HbH Remote RX
  rx_pin: GPIO32

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - hbh_rx.h           # the decoder (shared with hbh-one.yaml)

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret hbh_remote_rx_api_key

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # manual_ip:
  #   static_ip: 192.168.1.79
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

globals:
  - id: cnt_ok
    type: uint32_t
    initial_value: '0'
  - id: cnt_incomplete
    type: uint32_t
    initial_value: '0'
  - id: cnt_foreign
    type: uint32_t
    initial_value: '0'

script:
  - id: report
    mode: queued        # two quick presses: the second must not be dropped while the LED blinks
    max_runs: 5
    parameters:
      key: string
      frames: int
      held_ms: int
      bits: string
    then:
      - homeassistant.event:
          event: esphome.hbh_remote
          data:
            key: !lambda "return key;"
            frames: !lambda "return frames;"
            held_ms: !lambda "return held_ms;"
            bits: !lambda "return bits;"
      - text_sensor.template.publish:
          id: last_key
          state: !lambda 'return key + " ×" + to_string(frames);'
      # for the brain of hbh.yaml: "seq|key|frames|held_ms|bits" (seq makes every press a new state)
      - lambda: |-
          static uint32_t seq = 0;
          seq++;
          id(remote_event).publish_state(to_string(seq) + "|" + key + "|" + to_string(frames) + "|" + to_string(held_ms) + "|" + bits);
      - light.turn_on: {id: led, brightness: 30%, red: 100%, green: 40%, blue: 0%}
      - delay: 150ms
      - light.turn_off: led

remote_receiver:
  pin:
    number: ${rx_pin}
    inverted: false
  tolerance: 30%
  filter: 120us
  idle: 3ms           # < frame-end LOW (4.9 ms): every packet ends with the sync HIGH
  buffer_size: 4kb
  # no dump: raw – the receiver outputs noise all the time and would flood the log/API
  on_raw:
    then:
      - lambda: |-
          // decoder and press tracker: hbh_rx.h (the same code as hbh-one.yaml, tested by tools/test_profiles.py)
          static const hbh_rx::Frame F = [] {
            hbh_rx::Frame f;
            f.one_h = ${rf_one_high}; f.one_l = ${rf_one_low}; f.zero_h = ${rf_zero_high}; f.zero_l = ${rf_zero_low};
            f.start = ${rf_start_high}; f.sync_h = ${rf_sync_high}; f.sync_l = ${rf_sync_low};
            f.nb = ${rf_frame_bits}; f.tb = ${rf_toggle_bit}; f.lh = std::string("${rf_bit_order}") == "lh";
            return f;
          }();
          // keys of the profile ("" = the remote has no such key) and their frame lengths
          static std::vector<std::pair<std::string, std::string>> CMD;
          static std::vector<int> LENS;
          if (CMD.empty()) {
            const char *K[][2] = {
              {"${key_light}", "light"}, {"${key_fan_minus}", "fan_minus"}, {"${key_fan_plus}", "fan_plus"},
              {"${key_timer}", "timer"}, {"${key_brighter}", "brighter"}, {"${key_dimmer}", "dimmer"},
              {"${key_light_on}", "light_on"}, {"${key_light_off}", "light_off"}, {"${key_fan_off}", "fan_off"},
              {"${key_power}", "power"}, {"${key_speed_1}", "speed_1"}, {"${key_speed_2}", "speed_2"},
              {"${key_speed_3}", "speed_3"}, {"${key_speed_4}", "speed_4"}};
            for (auto &k : K) if (k[0][0]) CMD.push_back({hbh_rx::norm(k[0], F.tb), k[1]});
            LENS.push_back(F.nb);
            for (auto &c : CMD) LENS.push_back((int) c.first.size());
          }
          bool candidate = false;
          std::string bits = hbh_rx::decode(F, LENS, x, &candidate);
          if (bits.empty()) { if (candidate) id(cnt_incomplete)++; return; }
          std::string norm = hbh_rx::norm(bits, F.tb), key = "unknown";
          for (auto &c : CMD) if (c.first == norm) { key = c.second; break; }
          if (key == "unknown") {
            // a remote the profile does not know (e.g. the user's own, before learning): still a press, key
            // "unknown" with its bits – the wizard of hbh.yaml learns from it
            id(cnt_foreign)++;
            static uint32_t t_unknown = 0;
            if (millis() - t_unknown > 300) { t_unknown = millis(); ESP_LOGI("rx", "unknown frame: %s", bits.c_str()); }
          } else {
            id(cnt_ok)++;
          }
          hbh_rx::Press done;
          if (hbh_rx::tracker().feed(key, norm, hbh_rx::toggle(bits, F.tb), millis(), F.frame_ms(), &done))
            id(report).execute(done.key, done.frames, done.held_ms, done.bits);

interval:
  # counters to HA every 5 s (not on every noise packet)
  - interval: 5s
    then:
      - lambda: |-
          if (id(frames_ok).state != id(cnt_ok)) id(frames_ok).publish_state(id(cnt_ok));
          if (id(frames_incomplete).state != id(cnt_incomplete)) id(frames_incomplete).publish_state(id(cnt_incomplete));
          if (id(frames_foreign).state != id(cnt_foreign)) id(frames_foreign).publish_state(id(cnt_foreign));
  # key released = no frames for > 250 ms -> report
  - interval: 50ms
    then:
      - lambda: |-
          hbh_rx::Press done;
          const int frame_ms = (${rf_frame_bits} * (${rf_one_high} + ${rf_one_low} + ${rf_zero_high} + ${rf_zero_low}) / 2 + ${rf_start_high} + ${rf_sync_high} + ${rf_sync_low}) / 1000;
          if (hbh_rx::tracker().poll(millis(), frame_ms, &done)) id(report).execute(done.key, done.frames, done.held_ms, done.bits);

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "LED"
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    channel_colors: GRB
    internal: true

text_sensor:
  - platform: template
    id: remote_event
    name: "${n_remote_event}"
    icon: mdi:remote
    entity_category: diagnostic
  - platform: template
    id: last_key
    name: "${n_last_key}"
    icon: mdi:remote

sensor:
  - platform: template
    id: frames_ok
    name: "${n_frames_ok}"
    icon: mdi:counter
    accuracy_decimals: 0
    lambda: "return 0;"
    update_interval: never
  - platform: template
    id: frames_incomplete
    name: "${n_frames_incomplete}"
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: "return 0;"
    update_interval: never
  - platform: template
    id: frames_foreign
    name: "${n_frames_foreign}"
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: "return 0;"
    update_interval: never
  - platform: wifi_signal
    name: "${n_wifi}"
    update_interval: 60s
  - platform: uptime
    name: "${n_uptime}"
